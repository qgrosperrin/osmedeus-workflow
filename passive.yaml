name: passive
desc: Running "passive" reconnaissance activities
type: general
validator: domain

usage: |
    osmedeus scan -f passive -t target.com

routines:
  - modules:
      - subdomain
  - modules:
      - dns
  - modules:
      - probing
  - modules:
      - sto
      - archive
      - ipspace
      - asset-discovery
  - modules:
      - name-expansion
  - modules:
      - fingerprint
  - modules:
      - screenshot
  - modules:
      - summary

