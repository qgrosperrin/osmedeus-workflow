name: spider
desc: Crawling links in http site

report:
  final:
    - "{{Output}}/linkfinding/links-{{Workspace}}.txt"

params:
  - httpFile: "{{Output}}/probing/http-{{Workspace}}.txt"
  - linkFile: "{{Output}}/linkfinding/links-{{Workspace}}.txt"
  - httpResponse: "{{Output}}/http-response/"
  - spiderTimeout: "2h"
  - spiderThreads: "{{ threads }}"
  - spiderPrallel: "{{ threads / 2 }}"
  - spiderDepth: "3"
  - crawlingTime: "30"
  - skipSpidering: "false"
  - defaultUA: "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"
  - httpThreads: "{{ threads * 10}}"
  - dirbFile: "{{Output}}/directory/unique-beautify-{{Workspace}}.txt"
  - dirbSpiderFile: "{{Output}}/linkfinding/dirbscan-urls-{{Workspace}}.txt"

pre_run:
  - CreateFolder("{{Output}}/linkfinding")

steps:
  - conditions:
      - '"{{skipSpidering}}" == "true"'
    scripts:
      - ErrPrintf("Filter", "Skipping spidering")
      - Exit(1)

  - required:
      - "{{Binaries}}/katana"
      - "{{httpFile}}"
    source: "{{httpFile}}"
    threads: '{{spiderPrallel}}'
    commands:
      - "timeout -k 1m {{spiderTimeout}} {{Binaries}}/katana -H '{{defaultUA}}' -c {{spiderThreads}} -jc -ct {{crawlingTime}} -u '[[.line]]' 2>/dev/null | sort -u >> {{linkFile}} || true"
    scripts:
      - SortU("{{linkFile}}")

  # 1b. Extract URLs discovered by dirbscan for targeted spidering
  - label: "Preparing dirbscan-discovered URLs for spidering"
    conditions:
      - "FileLength('{{dirbFile}}') > 0"
    scripts:
      - ExecCmd("awk -F' \\\\| |,' '{print $1}' {{dirbFile}} 2>/dev/null | grep -E '^https?://' | LC_ALL=C sort -u > {{dirbSpiderFile}}.all && LC_ALL=C sort -u {{httpFile}} 2>/dev/null > {{dirbSpiderFile}}.http && LC_ALL=C comm -23 {{dirbSpiderFile}}.all {{dirbSpiderFile}}.http > {{dirbSpiderFile}} && rm -f {{dirbSpiderFile}}.all {{dirbSpiderFile}}.http || true")
      - "Printf('==> Dirbscan URLs prepared for spidering: {{dirbSpiderFile}}')"

  # 1c. Spider from dirbscan-discovered paths (more targeted than root-only crawl)
  - label: "Spidering from dirbscan-discovered paths"
    conditions:
      - "FileLength('{{dirbSpiderFile}}') > 0"
    required:
      - "{{Binaries}}/katana"
    source: "{{dirbSpiderFile}}"
    threads: '{{spiderPrallel}}'
    commands:
      - "timeout -k 1m {{spiderTimeout}} {{Binaries}}/katana -H '{{defaultUA}}' -c {{spiderThreads}} -jc -ct {{crawlingTime}} -u '[[.line]]' 2>/dev/null | sort -u >> {{linkFile}} || true"
    scripts:
      - SortU("{{linkFile}}")

  - label: "Analyzing responses"
    required:
      - "{{Binaries}}/httpx"
      - "{{linkFile}}"
    scripts:
      - SortU("{{linkFile}}")
      - ExecCmd("cat {{linkFile}} | {{Binaries}}/httpx -silent -t {{httpThreads}} -H '{{defaultUA}}' --store-response-dir {{httpResponse}} -sc -cl -location -title -json > {{Output}}/linkfinding/raw-links.json || echo \"[!] spider: httpx exited $?; continuing\"")
      - ExecCmd("jq -r '[.url, (.status_code|tostring), (.content_length|tostring), (.location // \"\")] | join(\",\")' {{Output}}/linkfinding/raw-links.json 2>/dev/null > {{Output}}/linkfinding/beautify-{{Workspace}}.csv || true")
      - ExecCmd("jq -r '[.url, (.status_code|tostring), (.content_length|tostring), (.location // \"\")] | join(\" | \")' {{Output}}/linkfinding/raw-links.json 2>/dev/null > {{Output}}/linkfinding/beautify-{{Workspace}}.txt || true")
      - ExecCmd("cat {{Output}}/linkfinding/raw-links.json 2>/dev/null | {{Binaries}}/json-cleaner -f status_code,content_length | jq -r '[.url, (.status_code|tostring), (.content_length|tostring), (.location // \"\")] | join(\",\")' > {{Output}}/linkfinding/unique-beautify-{{Workspace}}.csv || true")
      - ExecCmd("cat {{Output}}/linkfinding/raw-links.json 2>/dev/null | {{Binaries}}/json-cleaner -f status_code,content_length | jq -r '[.url, (.status_code|tostring), (.content_length|tostring), (.location // \"\")] | join(\" | \")' > {{Output}}/linkfinding/unique-beautify-{{Workspace}}.txt || true")
      - ExecCmd("rm -rf {{Output}}/linkfinding/raw-links.json")
      - "Printf('==> The unfiltered result can be found at: {{Output}}/linkfinding/beautify-{{Workspace}}.txt')"

post_run:
  - ExecCmd("python3 {{Binaries}}/render_report.py --template {{Data}}/markdown/general-template.md --output {{Output}} --workspace {{Workspace}} --html {{Output}}/summary.html")