name: dirbscan
desc: Run directory scan based on http output

report:
  final:
    - "{{Output}}/directory/beautify-{{Workspace}}.txt"
    - "{{Output}}/directory/unique-beautify-{{Workspace}}.txt"

params:
  - httpFile: "{{Output}}/probing/http-{{Workspace}}.txt"
  - wordlists: "{{Data}}/wordlists/content/small.txt"
  - dlimit: '50000'
  - recursion: '0'
  - ffThreads: '{{ threads }}' # threads for single site
  - dirbThreads: '{{ threads / 3 }}'
  - ffTimeout: "1h"
  - defaultUA: "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"

pre_run:
  - CreateFolder("{{Output}}/directory")
  # ffuf requests the whole wordlist against every endpoint, so the request
  # count is the product of these two numbers.
  - "Printf('[input] dirbscan: ' + FileLength('{{httpFile}}') + ' endpoints x ' + FileLength('{{wordlists}}') + ' wordlist entries')"

steps:
  # check wildcard before brute force dns. We don't want tons of garbage here
  - conditions:
      - "FileLength('{{httpFile}}') > {{dlimit}}"
    scripts:
      - ErrPrintf("Filter", "Got input file greater than {{dlimit}} line")
      - Exit(1)

  - required:
      - "{{Binaries}}/ffuf"
      - "{{httpFile}}"
    source: "{{httpFile}}"
    threads: '{{dirbThreads}}'
    commands:
      - "timeout -k 1m {{ffTimeout}} {{Binaries}}/ffuf -s -t {{ffThreads}} -noninteractive -ac -acs advanced -timeout 15 -se -D -fc '429,404,400' -e 'asp,aspx,aspx~,asp~,py,py~,rb,rb~,php,php~,bak,bkp,cache,cgi,conf,csv,html,inc,js,json,jsp,jsp~,log,old,txt' -json -H '{{defaultUA}}' -u '[[.line]]/FUZZ' -w {{wordlists}}:FUZZ > {{Output}}/directory/raw-[[._id_]].json 2>/dev/null || echo \"[!] dirbscan: ffuf exited $? on [[.line]]; continuing\""
  - scripts:
      - ExecCmd("cat {{Output}}/directory/raw-*.json 2>/dev/null | jq -r '[.url,(.status|tostring),(.length|tostring),(.words|tostring),(.lines|tostring),(.redirectlocation // \"\")] | join(\",\")' > {{Output}}/directory/beautify-{{Workspace}}.csv || true")
      - ExecCmd("cat {{Output}}/directory/raw-*.json 2>/dev/null | jq -r '[.url,(.status|tostring),(.length|tostring),(.words|tostring),(.lines|tostring),(.redirectlocation // \"\")] | join(\" | \")' > {{Output}}/directory/beautify-{{Workspace}}.txt || true")
      # doing cleaning for the dirb result
      - ExecCmd("cat {{Output}}/directory/raw-*.json 2>/dev/null | {{Binaries}}/json-cleaner -f status,words,lines | jq -r '[.url,(.status|tostring),(.length|tostring),(.words|tostring),(.lines|tostring),(.redirectlocation // \"\")] | join(\",\")' > {{Output}}/directory/unique-beautify-{{Workspace}}.csv || true")
      - ExecCmd("cat {{Output}}/directory/raw-*.json 2>/dev/null | {{Binaries}}/json-cleaner -f status,words,lines | jq -r '[.url,(.status|tostring),(.length|tostring),(.words|tostring),(.lines|tostring),(.redirectlocation // \"\")] | join(\" | \")' > {{Output}}/directory/unique-beautify-{{Workspace}}.txt || true")
      - ExecCmd("rm -rf {{Output}}/directory/raw-*.json")
      - "Printf('==> The unfiltered result can be found at: {{Output}}/directory/beautify-{{Workspace}}.txt')"

post_run:
  - TotalDirb("{{Output}}/directory/unique-beautify-{{Workspace}}.txt")
  - ExecCmd("python3 {{Binaries}}/render_report.py --template {{Data}}/markdown/general-template.md --output {{Output}} --workspace {{Workspace}} --html {{Output}}/summary.html")
