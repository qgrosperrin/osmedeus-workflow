name: archive
desc: Finding archive URLs

report:
  final:
    - "{{Output}}/archive/{{Workspace}}-archive.txt"
    - "{{Output}}/archive/{{Workspace}}-interesting.txt"
    - "{{Output}}/archive/{{Workspace}}-archive-table.txt"

params:
  - httpFile: "{{Output}}/probing/http-{{Workspace}}.txt"
  - archiveFile: "{{Output}}/archive/{{Workspace}}-archive.txt"
  - overviewArchiveJsonFile: "{{Output}}/archive/{{Workspace}}-overview-archive.txt"
  - urlfinderConfig: "{{Data}}/external-configs/urlfinder-providers.yaml"
  - archiveTimeout: "1h"
  - httpTimeout: "10"
  - alimit: "10000"
  - archiveThreads: "{{ threads / 2 }}"
  - overviewThreads: "{{ threads * 5 }}"
  - defaultUA: "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"

pre_run:
  - CreateFolder("{{Output}}/archive")

steps:
  # 1. Fetch URLs using urlfinder
  - required:
      - "{{Binaries}}/urlfinder"
    commands:
      - "timeout -k 1m {{archiveTimeout}} {{Binaries}}/urlfinder -d {{Target}} -config {{urlfinderConfig}} -silent -all > {{Output}}/archive/raw-urlfinder-{{Workspace}}.txt || echo \"[!] archive: urlfinder exited $?; continuing\""
    scripts:
      - ExecCmd("LC_ALL=C sort -u {{Output}}/archive/raw-urlfinder-{{Workspace}}.txt 2>/dev/null | shuf -n {{alimit}} >> {{archiveFile}} || true")
      - ExecCmd("rm -f {{Output}}/archive/raw-urlfinder-{{Workspace}}.txt")
      - "SortU('{{archiveFile}}')"

  # 2. Analyze URLs with HTTPX and Generate Reports
  - required:
      - "{{Binaries}}/httpx"
      - "{{archiveFile}}"
    commands:
      - "cat {{archiveFile}} | {{Binaries}}/httpx -H '{{defaultUA}}' -timeout {{httpTimeout}} -t {{overviewThreads}} -no-fallback -no-color -silent -json -title -status-code -cl -location -follow-host-redirects >> {{overviewArchiveJsonFile}} || echo \"[!] archive: httpx exited $?; continuing\""
    scripts:
      - ExecCmd("jq -r '[.url, (.status_code|tostring), (.content_length|tostring), (.location // \"\")] | join(\",\")' {{overviewArchiveJsonFile}} 2>/dev/null > {{Output}}/archive/archive-{{Workspace}}.csv || true")
      - ExecCmd("jq -r '[.url, (.status_code|tostring), (.content_length|tostring), (.location // \"\")] | join(\" | \")' {{overviewArchiveJsonFile}} 2>/dev/null > {{Output}}/archive/{{Workspace}}-archive-table.txt || true")
      - "Printf('==> The raw JSON result can be found at: {{overviewArchiveJsonFile}}')"

post_run:
  - TotalArchive('{{archiveFile}}')
  - ExecCmd("python3 {{Binaries}}/render_report.py --template {{Data}}/markdown/general-template.md --output {{Output}} --workspace {{Workspace}} --html {{Output}}/summary.html")