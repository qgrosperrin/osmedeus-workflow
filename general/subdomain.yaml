name: subdomain
desc: Scanning for subdomain

report:
  final:
    - "{{Output}}/subdomain/final-{{Workspace}}.txt"
    - "{{Output}}/subdomain/{{Workspace}}-raw-amass.txt"
    - "{{Output}}/subdomain/more-{{Workspace}}.txt"

# {{Output}} == {{Workspaces}} + {{Workspace}} but strip "/" char
pre_run:
  - CreateFolder("{{Output}}/subdomain/")
  - CreateFolder("{{Output}}/ipspace/")

params:
  - orgName: ""
  - subfinderThreads: "{{threads * 6}}"
  - amassTimeout: "45m"
  - enableAmass: "true"
  - amassThreads: "200"
  - amassConfig: "{{Data}}/external-configs/amass-basic-config.yaml"
  - subfinderConfig: "{{Data}}/external-configs/subfinder-provider.yaml"

steps:
  - required:
      - "{{Binaries}}/subfinder"
    commands:
      - "{{Binaries}}/subfinder -d {{Target}} -provider-config {{subfinderConfig}} -t {{subfinderThreads}} -o {{Output}}/subdomain/{{Workspace}}-subfinder.txt >/dev/null 2>&1 || echo \"[!] subdomain: subfinder exited $?; continuing\""

  - required:
      - "{{Binaries}}/assetfinder"
      - "{{Binaries}}/findomain"
    commands:
      - >-
        {{Binaries}}/assetfinder -subs-only {{Target}} > {{Output}}/subdomain/{{Workspace}}-assetfinder.txt 2>/dev/null || echo "[!] subdomain: assetfinder exited $?; continuing";
        {{Binaries}}/findomain -u {{Output}}/subdomain/{{Workspace}}-findomain.txt -t {{Target}} >/dev/null 2>&1 || echo "[!] subdomain: findomain exited $?; continuing"

  - required:
      - "{{Binaries}}/github-subdomains"
    commands:
      - "if [ -n \"$GITHUB_TOKEN\" ]; then {{Binaries}}/github-subdomains -d {{Target}} -o {{Output}}/subdomain/{{Workspace}}-github.txt >/dev/null 2>&1 || echo \"[!] subdomain: github-subdomains exited $?; continuing\"; else touch {{Output}}/subdomain/{{Workspace}}-github.txt; fi"

  - required:
      - "{{Binaries}}/amass"
    conditions:
      - '"{{enableAmass}}" == "true"'
    commands:
      - "timeout -k 1m {{amassTimeout}} {{Binaries}}/amass enum -passive -dns-qps {{amassThreads}} -config {{amassConfig}} -silent -nocolor -d {{Target}} -o {{Output}}/subdomain/{{Workspace}}-raw-amass.txt >/dev/null 2>&1 || echo \"[!] subdomain: amass exited $?; continuing\""
    scripts:
      - ExecCmd("awk '{print $1}' {{Output}}/subdomain/{{Workspace}}-raw-amass.txt 2>/dev/null | tr 'A-Z' 'a-z' | sed 's/\\.$//' | grep -F '.{{Target}}' | sort -u > {{Output}}/subdomain/{{Workspace}}-amass.txt || true")

  # cleaning some result
  - required:
      - "{{Binaries}}/cleansub"
    scripts:
      - SortU("{{Output}}/subdomain/{{Workspace}}-github.txt")
      - Append("{{Output}}/subdomain/sum-{{Workspace}}.txt", "{{Output}}/subdomain/{{Workspace}}-amass.txt")
      - Append("{{Output}}/subdomain/sum-{{Workspace}}.txt", "{{Output}}/subdomain/{{Workspace}}-subfinder.txt")
      - Append("{{Output}}/subdomain/sum-{{Workspace}}.txt", "{{Output}}/subdomain/{{Workspace}}-assetfinder.txt")
      - Append("{{Output}}/subdomain/sum-{{Workspace}}.txt", "{{Output}}/subdomain/{{Workspace}}-findomain.txt")
      - Append("{{Output}}/subdomain/sum-{{Workspace}}.txt", "{{Output}}/subdomain/{{Workspace}}-github.txt")
      - Append("{{Output}}/subdomain/sum-{{Workspace}}.txt", "{{Output}}/subdomain/{{Workspace}}-ourl.txt")
      # append with result in stogres too
      # remove junk subdomain and 1-2-3.subdomain.com
      - ExecCmd("cat {{Output}}/subdomain/sum-{{Workspace}}.txt 2>/dev/null | {{Binaries}}/cleansub -t '{{Target}}' >> {{Output}}/subdomain/final-{{Workspace}}.txt")

  # get more related domains
  - required:
      - "{{Binaries}}/metabigor"
      - "{{Binaries}}/cleansub"
    commands:
      - "ORG=$(printf '%s' '{{orgName}}' | tr -d '[:space:]'); case \"$ORG\" in ''|*'{'*|*'<'*) ORG=$(printf '%s' '{{Target}}' | cut -d. -f1);; esac; printf '%s\\n' \"$ORG\" | {{Binaries}}/metabigor cert --json -o {{Output}}/subdomain/more-json-{{Workspace}}.txt >/dev/null 2>&1 || echo \"[!] subdomain: metabigor cert exited $?; continuing\""
    scripts:
      - ExecCmd("jq -r '.Domain // empty' {{Output}}/subdomain/more-json-{{Workspace}}.txt 2>/dev/null | sed 's/^\\*\\.//g' | sort -u >> {{Output}}/subdomain/more-{{Workspace}}.txt || true")
      - ExecCmd("cat {{Output}}/subdomain/more-{{Workspace}}.txt 2>/dev/null | {{Binaries}}/cleansub -t '{{Target}}' >> {{Output}}/subdomain/final-{{Workspace}}.txt || true")

  - scripts:
      - SortU("{{Output}}/subdomain/final-{{Workspace}}.txt")

post_run:
  - ExecCmd("python3 {{Binaries}}/render_report.py --template {{Data}}/markdown/general-template.md --output {{Output}} --workspace {{Workspace}} --html {{Output}}/summary.html")
