name: sto
desc: Subdomain Takeover scan

report:
  final:
    - '{{Output}}/sto/sto-{{Workspace}}-content.txt'
    - '{{Output}}/sto/sto-{{Workspace}}-dns.txt'
    - '{{Output}}/sto/takeoverable-{{Workspace}}.txt'
    - '{{Output}}/sto/baddns-{{Workspace}}.json'

params:
  - domainFile: "{{Output}}/subdomain/final-{{Workspace}}.txt"
  - httpFile: "{{Output}}/probing/http-{{Workspace}}.txt"
  - dnsFile: "{{Output}}/probing/dns-{{Workspace}}.txt"
  - stoThreads: '{{threads * 8}}'
  - baddnsThreads: '{{threads * 4}}'
  - defaultUA: "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"

pre_run:
  - CreateFolder("{{Output}}/sto")
  - StartNoti()

steps:
  - required:
      - "{{Binaries}}/nuclei"
      - "{{domainFile}}"
    commands:
      - "{{Binaries}}/nuclei -ni -no-color -silent -c {{stoThreads}} -t ~/nuclei-templates/dns -l {{domainFile}} | grep -v '[info]' | tee -a {{Output}}/sto/sto-{{Workspace}}-dns.txt"
      - "{{Binaries}}/nuclei -H '{{defaultUA}}' -ni -no-color -silent -c {{stoThreads}} -t ~/nuclei-templates/takeovers -l {{httpFile}} | tee -a {{Output}}/sto/sto-{{Workspace}}-content.txt"

  # baddns - comprehensive DNS takeover and misconfiguration checks
  - label: "Running baddns subdomain takeover and DNS checks"
    required:
      - "baddns"
      - "{{domainFile}}"
    source: "{{domainFile}}"
    threads: '{{baddnsThreads}}'
    commands:
      - "baddns [[.line]] --silent 2>/dev/null >> {{Output}}/sto/baddns-{{Workspace}}.json"
    scripts:
      - "Printf('==> BadDNS output: {{Output}}/sto/baddns-{{Workspace}}.json')"

