name: screenshot
desc: Screenshot based on result of probing

report:
  final:
    - "{{Output}}/screenshot/{{Workspace}}-screenshots/screenshot-{{Workspace}}.html"
    - "{{Output}}/screenshot/{{Workspace}}-screenshots/index_screenshot.txt"


params:
  - diffHttpFile: "{{Output}}/probing/diffhttp-{{Workspace}}.txt"
  - screenThreads: "{{ threads / 2 }}"
  - screenTimeout: "15"
  - defaultUA: "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"

# {{Output}} == {{Workspaces}} + {{Workspace}} but strip "/" char
pre_run:
  - CreateFolder("{{Output}}/screenshot")

steps:
  - required:
      - "{{Binaries}}/httpx"
      - "{{diffHttpFile}}"
    commands:
      - "cat {{diffHttpFile}} | jq -r '.url' 2>/dev/null | {{Binaries}}/httpx -H '{{defaultUA}}' -t {{screenThreads}} -no-color -silent -screenshot -screenshot-timeout {{screenTimeout}} -json -store-response-dir {{Output}}/screenshot/{{Workspace}}-screenshots/ >/dev/null 2>&1 || echo \"[!] screenshot: httpx exited $?; continuing\""
    scripts:
      - ExecCmd("mv {{Output}}/screenshot/{{Workspace}}-screenshots/screenshot.html {{Output}}/screenshot/{{Workspace}}-screenshots/screenshot-{{Workspace}}.html")
      - ExecCmd("ls {{Output}}/screenshot/ > {{Output}}/screenshot/number-of-screenshot.txt")

post_run:
  - TotalScreenShot('{{Output}}/screenshot/number-of-screenshot.txt')
