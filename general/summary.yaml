name: summary
desc: Run all the clean up script and generate summary report

steps:
  - scripts:
    - ExecCmd("python3 {{Binaries}}/export_to_sqlite.py --output {{Output}} --target {{Target}} --workspace {{Workspace}}")
    - Compress('{{Output}}/{{Workspace}}.tar.gz', '{{Output}}')
    - ExecCmd("python3 {{Binaries}}/render_report.py --no-sqlite-sync --template {{Data}}/markdown/general-template.md --output {{Output}} --workspace {{Workspace}} --html {{Output}}/summary.html")
