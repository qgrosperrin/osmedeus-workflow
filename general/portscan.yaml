name: portscan
desc: Quick port scan for all port

report:
  final:
    - "{{Output}}/portscan/open-ports.txt"
    - "{{Output}}/portscan/{{Workspace}}-detail.txt"
    - "{{Output}}/portscan/nmap-raw-{{Workspace}}.txt"
    - "{{Output}}/portscan/{{Workspace}}-screenshots/screenshot-{{Workspace}}.html"
    - "{{Output}}/portscan/{{Workspace}}-http.txt"

pre_run:
  - CreateFolder("{{Output}}/portscan")
  # The port sweep sends one probe per address per port, so these two numbers
  # are the whole cost of the Module.
  - "Printf('[input] portscan: ' + FileLength('{{nonCdnFile}}') + ' addresses over ports {{ports}}')"

# only run for top 1k port
# edit via osmedeus scan -P 'ports=0-65535' -P 'rate=5000' ...
params:
  - nonCdnFile: "{{Output}}/ipspace/{{Workspace}}-noncdn.txt"
  - defaultUA: "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"
  # portscan
  - ports: "0-65535"
  - rateRustScan: "{{ threads * 400 }}"
  - httpThreads: "{{ threads * 8 }}"
  - screenThreads: "{{ threads * 2}}"
  - skipPortScan: "false"

steps:
  # do port scan first
  - required:
      - '{{nonCdnFile}}'
    commands:
      - "{{Binaries}}/rustscan --timeout 3000 -b {{rateRustScan}} --scripts None --range {{ports}} -a {{nonCdnFile}} -g >> {{Output}}/portscan/raw-open-ports.txt"
    scripts:
      - CleanRustScan("{{Output}}/portscan/raw-open-ports.txt", "{{Output}}/portscan/open-ports.txt")

  # detect http running on open ports and service
  - required:
      - "{{Output}}/portscan/open-ports.txt"
      - "{{Output}}/portscan/raw-open-ports.txt"
    commands:
      - "cat {{Output}}/portscan/open-ports.txt | {{Binaries}}/httpx -H '{{defaultUA}}' -silent -no-color -t {{httpThreads}} -timeout 7 >> {{Output}}/portscan/{{Workspace}}-http.txt"
    scripts:
      - SortU('{{Output}}/portscan/{{Workspace}}-http.txt')


  - required:
      - "{{Binaries}}/httpx"
      - "{{Output}}/portscan/{{Workspace}}-http.txt"
    commands: 
      - "cat {{Output}}/portscan/{{Workspace}}-http.txt | {{Binaries}}/httpx -H '{{defaultUA}}' -t {{screenThreads}} -no-color -silent -screenshot -screenshot-timeout {{screenTimeout}} -json -store-response-dir {{Output}}/portscan/{{Workspace}}-screenshots/ > /dev/null 2>&1"
    scripts:
      - ExecCmd("mv {{Output}}/portscan/{{Workspace}}-screenshots/screenshot.html {{Output}}/portscan/{{Workspace}}-screenshots/screenshot-{{Workspace}}.html")
      - ExecCmd("ls {{Output}}/portscan/ > {{Output}}/portscan/number-of-screenshot.txt")

post_run:
  - ExecCmd("python3 {{Binaries}}/render_report.py --template {{Data}}/markdown/general-template.md --output {{Output}} --workspace {{Workspace}} --html {{Output}}/summary.html")
