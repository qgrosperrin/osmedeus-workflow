name: secrets
desc: Scan for cryptographic secrets and leaked credentials in HTTP responses

report:
  final:
    - "{{Output}}/secrets/trufflehog-{{Workspace}}.txt"
    - "{{Output}}/secrets/badsecrets-{{Workspace}}.txt"
    - "{{Output}}/secrets/badsecrets-{{Workspace}}.json"

params:
  - httpFile: "{{Output}}/probing/http-{{Workspace}}.txt"
  - linkFile: "{{Output}}/linkfinding/links-{{Workspace}}.txt"
  - uniqueSpiderFile: "{{Output}}/linkfinding/unique-beautify-{{Workspace}}.txt"
  - badsecretTargetsFile: "{{Output}}/secrets/badsecrets-targets-{{Workspace}}.txt"
  - badsecretLimit: "1000"
  - httpResponse: "{{Output}}/http-response/"
  - trufflehogThreads: "{{ threads * 6 }}"
  - badsecretThreads: "{{ threads / 2 }}"
  - badsecretTimeout: "2h"
  - defaultUA: "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"
  - uaValue: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36"

pre_run:
  - CreateFolder("{{Output}}/secrets")

steps:
  # 1. trufflehog - entropy-based secret scanning over stored HTTP responses
  - label: "Deep secret scanning with trufflehog"
    required:
      - "{{Binaries}}/trufflehog"
      - "{{httpResponse}}"
    commands:
      - "{{Binaries}}/trufflehog --no-verification --json --log-level=-1 --concurrency={{trufflehogThreads}} filesystem {{httpResponse}} > {{Output}}/secrets/trufflehog-{{Workspace}}.txt 2>/dev/null || echo \"[!] secrets: trufflehog exited $?; continuing\""
    scripts:
      - "Printf('==> Trufflehog output: {{Output}}/secrets/trufflehog-{{Workspace}}.txt')"

  # 2a. Prepare deduplicated dynamic/HTML targets for badsecrets
  - label: "Preparing candidate endpoints for badsecrets"
    scripts:
      - ExecCmd("{ cat {{httpFile}} 2>/dev/null; awk -F' \\\\| |,' '{print $1}' {{uniqueSpiderFile}} 2>/dev/null; } | grep -E '^https?://' | grep -ivE '\\.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|pdf|zip|mp4|mp3)($|\\?)' | sort -u | head -n {{badsecretLimit}} > {{badsecretTargetsFile}} || true")

  # 2b. badsecrets - check HTTP hosts for known/weak cryptographic secrets (viewstates, signed cookies, JWTs, etc.)
  - label: "Scanning for known cryptographic secrets with badsecrets"
    required:
      - "{{Binaries}}/badsecrets"
      - "{{badsecretTargetsFile}}"
    conditions:
      - "FileLength('{{badsecretTargetsFile}}') > 0"
    source: "{{badsecretTargetsFile}}"
    threads: '{{badsecretThreads}}'
    commands:
      - "timeout -k 1m 120 {{Binaries}}/badsecrets --user-agent '{{uaValue}}' --url '[[.line]]' --json --passive-only > {{Output}}/secrets/raw-badsecrets-[[._id_]].json 2>/dev/null || true"
    scripts:
      - ExecCmd("jq -s '[.[] | if type == \"array\" then .[] else . end]' {{Output}}/secrets/raw-badsecrets-*.json 2>/dev/null > {{Output}}/secrets/badsecrets-{{Workspace}}.json || echo '[]' > {{Output}}/secrets/badsecrets-{{Workspace}}.json")
      - ExecCmd("jq -r '.[]? | \"[HIGH] \" + (.url // \"\") + \" | \" + ([.detecting_module, (.details.product_type // empty), (.secret // empty)] | join(\" - \"))' {{Output}}/secrets/badsecrets-{{Workspace}}.json 2>/dev/null | sort -u > {{Output}}/secrets/badsecrets-{{Workspace}}.txt || true")
      - ExecCmd("rm -f {{Output}}/secrets/raw-badsecrets-*.json {{badsecretTargetsFile}}")
      - "Printf('==> Badsecrets output: {{Output}}/secrets/badsecrets-{{Workspace}}.txt')"

post_run:
  - ExecCmd("python3 {{Binaries}}/render_report.py --template {{Data}}/markdown/general-template.md --output {{Output}} --workspace {{Workspace}} --html {{Output}}/summary.html")