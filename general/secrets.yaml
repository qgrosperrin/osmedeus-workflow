name: secrets
desc: Scan for cryptographic secrets and leaked credentials in HTTP responses

report:
  final:
    - "{{Output}}/secrets/trufflehog-{{Workspace}}.txt"
    - "{{Output}}/secrets/badsecrets-{{Workspace}}.txt"
    - "{{Output}}/secrets/badsecrets-{{Workspace}}.json"

params:
  - linkFile: "{{Output}}/linkfinding/links-{{Workspace}}.txt"
  - httpResponse: "{{Output}}/http-response/"
  - trufflehogThreads: "{{ threads * 6 }}"
  - badsecretThreads: "{{ threads / 2 }}"
  - badsecretTimeout: "2h"
  - defaultUA: "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0.0.0 Safari/537.36"

pre_run:
  - CreateFolder("{{Output}}/secrets")

steps:
  # 1. trufflehog - entropy-based secret scanning over stored HTTP responses
  - label: "Deep secret scanning with trufflehog"
    required:
      - "{{httpResponse}}"
    commands:
      - "trufflehog --concurrency={{trufflehogThreads}} filesystem {{httpResponse}} > {{Output}}/secrets/trufflehog-{{Workspace}}.txt 2>&1"
    scripts:
      - "Printf('==> Trufflehog output: {{Output}}/secrets/trufflehog-{{Workspace}}.txt')"

  # 2. badsecrets - check HTTP hosts for known/weak cryptographic secrets (viewstates, signed cookies, JWTs, etc.)
  - label: "Scanning for known cryptographic secrets with badsecrets"
    required:
      - "badsecrets"
      - "{{linkFile}}"
    source: "{{linkFile}}"
    threads: '{{badsecretThreads}}'
    commands:
      - "timeout -k 1m 120 badsecrets --url [[.line]] --json --passive-only 2>/dev/null >> {{Output}}/secrets/raw-badsecrets-{{Workspace}}.json"
    scripts:
      - ExecCmd("cat {{Output}}/secrets/raw-badsecrets-{{Workspace}}.json | jq -r '.' > {{Output}}/secrets/badsecrets-{{Workspace}}.json 2>/dev/null || true")
      - ExecCmd("cat {{Output}}/secrets/raw-badsecrets-{{Workspace}}.json | jq -r '[.detecting_module, .secret, .details.product_type // \"\", .url // \"\"] | join(\" | \")' > {{Output}}/secrets/badsecrets-{{Workspace}}.txt 2>/dev/null || true")
      - "Printf('==> Badsecrets output: {{Output}}/secrets/badsecrets-{{Workspace}}.txt')"